<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introducción a CSS 👍</title>
</head>
<body>
 <!-- 1. CSS dentro del elemento <style>...</style> -->
  <style>
   
    h1 {
        color: red;
        font-size: 200px
   }

  </style>
<h1>Introducción a CSS</h1>

<!-- 2. Escribimos CSS en linea. Dentro de la etiqueta de apertura de un elemnto de html-->

<p style="color: orange; font-size:46px">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
 

 <!-- 3. Escribimos CSS en un documento externo y lo llamamos a traves de el elemento link-->
<h2>CSS externo</h2>
<link rel="stylesheet" href="./style.css">
</body>
</html>
